<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img" aria-label="GolemUI {gui.} mark — cursor types it">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style><![CDATA[
      .ch1 { opacity: 0; animation: appear 0.05s 0.6s forwards; }
      .ch2 { opacity: 0; animation: appear 0.05s 1.0s forwards; }
      .ch3 { opacity: 0; animation: appear 0.05s 1.4s forwards; }
      .ch4 { opacity: 0; animation: appear 0.05s 1.8s forwards; }
      .cursor { animation: blink 0.55s infinite, fadeout 0.4s 2.3s forwards; }
      @keyframes appear  { to { opacity: 1; } }
      @keyframes blink   { 50% { opacity: 0.15; } }
      @keyframes fadeout { to { opacity: 0; } }
    ]]></style>
  </defs>

  <text x="200" y="170"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="600"
        font-size="160"
        text-anchor="middle"
        letter-spacing="-2">
    <tspan fill="url(#brand)">{</tspan><tspan class="ch1" fill="#ffffff">g</tspan><tspan class="ch2" fill="#ffffff">u</tspan><tspan class="ch3" fill="#ffffff">i</tspan><tspan class="ch4" fill="#ffffff">.</tspan><tspan fill="url(#brand)">}</tspan>
  </text>

  <rect class="cursor" y="55" width="8" height="130" fill="#ffffff" rx="2">
    <animate attributeName="x"
             values="74;160;246;287;328"
             keyTimes="0;0.26;0.43;0.61;0.78"
             dur="2.3s"
             begin="0s"
             fill="freeze"
             calcMode="discrete"/>
  </rect>
</svg>
