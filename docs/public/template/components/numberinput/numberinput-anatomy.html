<gui-number>
  <label for="fieldUid">
    Label
    <div class="gui-number__hint" id="fieldUid_hint">Hint</div>
  </label>

  <div class="gui-widget">
    <button
      type="button"
      tabindex="-1"
      class="gui-button gui-number__minus"
    >
      -
    </button>

    <input
      type="number"
      inputmode="decimal"
      id="fieldUid"
      placeholder="Custom placeholder"
      aria-required="true"
      aria-describedby="fieldUid_hint"
    />

    <button
      type="button"
      tabindex="-1"
      class="gui-button gui-number__plus"
    >
      +
    </button>
  </div>
</gui-number>
