<div class="gui-repeater">
  <div id="repeater_uid">
    <h2>Guest List</h2>

    <div class="gui-repeater__card">
      <div class="gui-repeater__card-header">
        <span class="gui-repeater__card-title">Guest</span>

        <button type="button" class="gui-button gui-repeater__remove-btn">
          <span class="gui-button-icon material-icons material-icons-delete"></span>
          Remove Guest
        </button>
      </div>

      <gui-repeater-widget>
        <div class="gui-label">
          <label>Full Name</label>
        </div>
        <div class="gui-widget">
          <input type="text" value="John Doe" />
        </div>
      </gui-repeater-widget>
    </div>

    <button type="button" class="gui-button gui-repeater__add-btn">
      <span class="gui-button-icon material-icons material-icons-person_add"></span>
      Add Guest
    </button>
  </div>
</div>
