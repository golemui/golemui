<form id="checkout">
    <gui-alert  variant="info" defer-hydration>Yearly billing saves two months.</gui-alert>
    <gui-textinput






     uid="email" name="email" label="Email" hint="We send the receipt here." value="ada@example.com" required class="gui-field" data-golemui-ssr defer-hydration>
      <label
      class="gui-label"
      for="email"
      data-cy="email_label"
      id="email_label"
    >
      <span class="gui-label__text"
        >Email<span aria-hidden="true"> *</span></span
      >
      <div class="gui-widget-hint" id="email_hint" aria-hidden="true">We send the receipt here.</div>

    </label>

      <div class="gui-widget">
        <input
          type="text"
          id="email"
          data-cy="email_textinput"
          class=" gui-widget-input "
          value="ada@example.com"







        />

      </div>

      <div
    class=" gui-validator gui-validator--empty "
    id="email_errors"
    role="alert"


  >

  </div>
    </gui-textinput>
    <gui-tabs  active="billing" defer-hydration>
      <gui-tab-list  aria-label="Checkout" defer-hydration>
        <gui-tab  panel="billing" defer-hydration>Billing</gui-tab>
      </gui-tab-list>
      <gui-tab-panel  name="billing" defer-hydration>
        <gui-select





         uid="plan" name="plan" label="Plan" value="team" options="[{&quot;label&quot;:&quot;Starter&quot;,&quot;value&quot;:&quot;starter&quot;},{&quot;label&quot;:&quot;Team&quot;,&quot;value&quot;:&quot;team&quot;}]" class="gui-field" data-golemui-ssr defer-hydration>
      <label
      class="gui-label"
      for="plan"
      data-cy="plan_label"
      id="plan_label"
    >
      <span class="gui-label__text"
        >Plan</span
      >


    </label>

      <div class="gui-widget">
        <select
          id="plan"
          data-cy="plan_select"
          class=" gui-widget-input "






        >

          <option value="" disabled>
            Select an option
          </option>
          <option
                value="starter"
              >
                Starter
              </option><option
                value="team"
                selected="true"
              >
                Team
              </option>

        </select>
        <span class="gui-select__arrow"><span class="gui-caret" aria-hidden="true"></span></span>

      </div>

      <div
    class=" gui-validator gui-validator--empty "
    id="plan_errors"
    role="alert"


  >

  </div>
    </gui-select>
      </gui-tab-panel>
    </gui-tabs>
    <button type="button" popovertarget="plan-help" id="plan-help-button">
      What does a plan include?
    </button>
    <gui-tooltip  for="plan-help-button" defer-hydration>Opens the plan details</gui-tooltip>
    <gui-popover  placement="bottom-start" defer-hydration>
      <div id="plan-help" popover>Every plan includes email support.</div>
    </gui-popover>
    <button type="button" popovertarget="plan-actions" id="plan-actions-button">Plan</button>
    <gui-menu defer-hydration>
      <div id="plan-actions" popover>
        <button type="button" value="upgrade">Upgrade</button>
        <hr />
        <button type="button" value="cancel">Cancel the plan</button>
      </div>
    </gui-menu>
    <gui-dialog  placement="end" defer-hydration>
      <dialog id="plan-dialog" aria-labelledby="plan-dialog-title">
        <h2 id="plan-dialog-title">Compare plans</h2>
        <gui-textinput    uid="coupon" name="coupon" label="Coupon" class="gui-field" data-golemui-ssr defer-hydration>
      <label
      class="gui-label"
      for="coupon"
      data-cy="coupon_label"
      id="coupon_label"
    >
      <span class="gui-label__text"
        >Coupon</span
      >


    </label>

      <div class="gui-widget">
        <input
          type="text"
          id="coupon"
          data-cy="coupon_textinput"
          class=" gui-widget-input "
          value=""







        />

      </div>

      <div
    class=" gui-validator gui-validator--empty "
    id="coupon_errors"
    role="alert"


  >

  </div>
    </gui-textinput>
      </dialog>
    </gui-dialog>
    <gui-checkbox     uid="terms" name="terms" label="I accept the terms" value="true" class="gui-field" data-golemui-ssr defer-hydration>
      <label
        class="gui-label"
        for="terms"
        data-cy="terms_label"
        id="terms_label"
      >
        <div class="gui-widget gui-widget--horizontal">
          <input
            type="checkbox"
            id="terms"
            data-cy="terms_checkbox"
            checked="true"




          />
        </div>

        <span class="gui-label__container">
          <span class="gui-label__text"
            >I accept the terms</span
          >
        </span>
      </label>

      <div class="gui-widget-hint">

        <div
    class=" gui-validator gui-validator--empty "
    id="terms_errors"
    role="alert"


  >

  </div>
      </div>
    </gui-checkbox>
    <gui-slider      uid="seats" name="seats" label="Seats" value="12" maximum="50" class="gui-field" data-golemui-ssr defer-hydration>
      <label
      class="gui-label"
      for="seats"
      data-cy="seats_label"
      id="seats_label"
    >
      <span class="gui-label__text"
        >Seats</span
      >

      <output class="gui-slider__value" aria-hidden="true">12</output>
    </label>

      <div class="gui-widget">
        <div class="gui-slider__control">
          <div class="gui-slider__rail" aria-hidden="true">
            <span
              class="gui-slider__fill"
              style="--_start:0;--_end:24;"
            ></span>
          </div>

          <input
            type="range"
            id="seats"
            data-cy="seats_slider"
            class="gui-slider__input"
            min="0"
            max="50"
            step="1"
            value="12"

            aria-valuetext="12"





          />

        </div>
      </div>

      <div class="gui-slider__footer"><div
    class=" gui-validator gui-validator--empty "
    id="seats_errors"
    role="alert"


  >

  </div></div>
    </gui-slider>
    <gui-otp      uid="pin" name="pin" label="Sign-in code" value="123" groups="3,3" class="gui-field" data-golemui-ssr defer-hydration>
      <label
      class="gui-label"
      for="pin"
      data-cy="pin_label"
      id="pin_label"
    >
      <span class="gui-label__text"
        >Sign-in code</span
      >


    </label>

      <div class="gui-widget">
        <div class="gui-otp__control" dir="ltr">
          <div class="gui-otp__boxes" aria-hidden="true">


          <span class="gui-otp__group">
            <span class=" gui-otp__box gui-otp__box--filled ">1</span><span class=" gui-otp__box gui-otp__box--filled ">2</span><span class=" gui-otp__box gui-otp__box--filled ">3</span>
          </span>

          <span class="gui-otp__separator"></span>
          <span class="gui-otp__group">
            <span class=" gui-otp__box gui-otp__box--active "></span><span class=" gui-otp__box "></span><span class=" gui-otp__box "></span>
          </span>

    </div>
          <input
            type="text"
            id="pin"
            data-cy="pin_otp"
            class="gui-otp__input"
            inputmode="numeric"
            autocomplete="one-time-code"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            value="123"









          />
        </div>
      </div>

      <div
    class=" gui-validator gui-validator--empty "
    id="pin_errors"
    role="alert"


  >

  </div>
    </gui-otp>
    <gui-toaster  placement="top-end" defer-hydration></gui-toaster>
  </form>
