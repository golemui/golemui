@let templateData = adapter.templateData();

<div [id]="widget.uid">
  @if (templateData.label) {
    <h2>{{ templateData.label }}</h2>
  }
  @if (templateData.template && templateData.value) {
    @for (item of templateData.value; track item) {
      <div class="gui-repeater__card">
        <div class="gui-repeater__card-header">
          @if (templateData.title) {
            <span class="gui-repeater__card-title">{{ templateData.title }} {{ $index + 1 }}</span>
          }
          <button type="button" class="gui-button gui-repeater__remove-btn" (click)="removeItem($index)">
            @if (templateData.removeButtonIcon) {
              <span class="gui-button-icon {{ templateData.removeButtonIcon }}"></span>
            }
            {{ templateData.removeLabel ?? 'Remove' }}
          </button>
        </div>
        <ng-container guiRepeaterWidget [repeaterIndex]="$index" [widget]="templateData.template" />
      </div>
    }
  }
  <button
    type="button"
    class="gui-button gui-repeater__add-btn"
    (click)="addItem()"
    [disabled]="
      templateData.limit ? templateData.limit === (templateData.value?.length ?? 0) : false
    "
  >
    @if (templateData.addButtonIcon) {
      <span class="gui-button-icon {{ templateData.addButtonIcon }}"></span>
    }
    {{ templateData.addLabel ?? 'Add' }}
  </button>
</div>
