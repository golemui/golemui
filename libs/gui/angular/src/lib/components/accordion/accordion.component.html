@let templateData = adapter.templateData();

<div class="gui-widget" [id]="widget.uid">
  @for (section of templateData.sections; track section.uid) {
    <div class="gui-accordion__section">
      <button
        type="button"
        tabindex="0"
        [id]="'accordion_button_' + section.uid"
        [attr.aria-controls]="'accordion_section_' + section.uid"
        [attr.aria-expanded]="activeSections[section.uid] ? 'true' : 'false'"
        [class.active]="activeSections[section.uid]"
        (click)="onClickButton(section.uid)"
      >
        {{ section.label
        }}<span class="gui-accordion__arrow"
          ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256">
            <path
              d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"
            ></path></svg
        ></span>
      </button>

      @let child = getChild(section.uid);
      @if (child && (activeSections[section.uid] || templateData.renderMode !== 'activeOnly')) {
        <section
          class="gui-widget"
          role="region"
          [hidden]="!activeSections[section.uid] && templateData.renderMode !== 'activeOnly'"
          [id]="'accordion_section_' + section.uid"
          [attr.aria-labelledby]="'accordion_button_' + section.uid"
        >
          <ng-container guiWidget [widget]="child" />
        </section>
      }
    </div>
  }
</div>
