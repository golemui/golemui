@let templateData = adapter.templateData();

<gui-accordion
  [attr.defer-hydration]="deferHydration"
  [id]="widget.uid"
  [multiple]="!templateData.singleOpen"
>
  @for (section of templateData.sections; track section.uid) {
    <gui-accordion-item
      [attr.defer-hydration]="deferHydration"
      [open]="isOpen(section.uid)"
      (gui-toggle)="onToggle($event, section.uid)"
    >
      <details [open]="isOpen(section.uid)">
        <summary [id]="buttonId(section.uid)">{{ section.label }}</summary>

        @let child = getChild(section.uid);
        @if (child && (isOpen(section.uid) || templateData.renderMode !== 'activeOnly')) {
          <section
            class="gui-widget"
            role="region"
            [id]="sectionId(section.uid)"
            [attr.aria-labelledby]="buttonId(section.uid)"
          >
            <ng-container guiWidget [widget]="child" />
          </section>
        }
      </details>
    </gui-accordion-item>
  }
</gui-accordion>
