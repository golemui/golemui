@let templateData = adapter.templateData();

<div
  class="gui-flex__widget"
  [class.gui-flex__widget--row]="templateData.direction === 'row'"
  [class.gui-flex__widget--row-reverse]="templateData.direction === 'row-reverse'"
  [class.gui-flex__widget--column]="!templateData.direction || templateData.direction === 'column'"
  [class.gui-flex__widget--column-reverse]="templateData.direction === 'column-reverse'"
  [class.gui-flex__widget--justify-center]="templateData.justify === 'center'"
  [class.gui-flex__widget--justify-start]="templateData.justify === 'start'"
  [class.gui-flex__widget--justify-end]="templateData.justify === 'end'"
  [class.gui-flex__widget--justify-stretch]="templateData.justify === 'stretch'"
  [class.gui-flex__widget--align-center]="templateData.align === 'center'"
  [class.gui-flex__widget--align-start]="templateData.align === 'start'"
  [class.gui-flex__widget--align-end]="templateData.align === 'end'"
  [class.gui-flex__widget--align-space-between]="templateData.align === 'space-between'"
  [class.gui-flex__widget--align-space-around]="templateData.align === 'space-around'"
  [class.gui-flex__widget--align-space-evenly]="templateData.align === 'space-evenly'"
  [style.gap.px]="templateData.gap"
  [id]="widget.uid"
>
  @for (child of templateData.children; track child.uid) {
    <ng-container guiWidget [widget]="child" />
  }
</div>
