@let templateData = adapter.templateData();

<gui-button
  [attr.defer-hydration]="deferHydration"
  [uid]="widget.uid"
  [idPrefix]="adapter.formName"
  [type]="templateData.actionType ?? 'button'"
  [label]="templateData.label"
  [disabled]="templateData.disabled"
  [variant]="templateData.variant"
  [icon]="templateData.icon"
  [iconPosition]="templateData.iconPosition"
  [buttonAriaLabel]="templateData.ariaLabel"
  (click)="onClick()"
></gui-button>
