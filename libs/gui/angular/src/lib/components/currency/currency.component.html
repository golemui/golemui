@let templateData = adapter.templateData();

<gui-currency
  [attr.defer-hydration]="deferHydration"
  [uid]="widget.uid"
  [label]="templateData.label"
  [hint]="templateData.hint"
  [errors]="templateData.errors"
  [touched]="templateData.touched"
  [required]="templateData.validator?.required"
  [disabled]="templateData.disabled"
  [readOnly]="templateData.readonly"
  [value]="templateData.value"
  [currency]="templateData.currency"
  [step]="templateData.step"
  [maximumFractionDigits]="templateData.maximumFractionDigits"
  [minimumFractionDigits]="templateData.minimumFractionDigits"
  [icon]="templateData.icon"
  [placeholder]="templateData.placeholder"
  [autocomplete]="templateData.autocomplete"
  [localeId]="templateData.lang"
  (input)="valueChanged($event)"
  (blur)="adapter.onBlur()"
></gui-currency>
