@let templateData = adapter.templateData();

<div
  class="gui-grid__widget"
  [class.gui-grid__widget--row]="templateData.direction === 'row'"
  [class.gui-grid__widget--row--auto-fit]="templateData.direction === 'row' && !!templateData.autoFit"
  [class.gui-grid__widget--column]="!templateData.direction || templateData.direction === 'column'"
  [class.gui-grid__widget--align-center]="templateData.align === 'center'"
  [class.gui-grid__widget--align-start]="templateData.align === 'start'"
  [class.gui-grid__widget--align-end]="templateData.align === 'end'"
  [class.gui-grid__widget--align-space-between]="templateData.align === 'space-between'"
  [class.gui-grid__widget--align-space-around]="templateData.align === 'space-around'"
  [class.gui-grid__widget--align-space-evenly]="templateData.align === 'space-evenly'"
  [class.gui-grid__widget--align-stretch]="templateData.align === 'stretch'"
  [class.gui-grid__widget--justify-center]="templateData.justify === 'center'"
  [class.gui-grid__widget--justify-start]="templateData.justify === 'start'"
  [class.gui-grid__widget--justify-end]="templateData.justify === 'end'"
  [class.gui-grid__widget--justify-stretch]="templateData.justify === 'stretch'"
  [style.column-gap.px]="templateData.columnGap"
  [style.row-gap.px]="templateData.rowGap"
  [id]="widget.uid"
>
  @for (child of templateData.children; track child.uid) {
    <div class="gui-grid__cell" [style.grid-column]="'span ' + (child.size || 1)">
      <ng-container guiWidget [widget]="child" />
    </div>
  }
</div>
