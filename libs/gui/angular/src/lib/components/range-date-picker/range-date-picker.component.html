@let templateData = adapter.templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

@if (templateData.label) {
  <label gui-label [for]="widget.uid" [uid]="widget.uid" [templateData]="templateData"></label>
}

<div
  role="button"
  tabindex="-1"
  class="gui-widget"
  [attr.aria-expanded]="isCalendarOpen()"
  (keyup.space)="$event.target === $event.currentTarget && isCalendarOpen.set(!isCalendarOpen())"
  (keyup.enter)="$event.target === $event.currentTarget && isCalendarOpen.set(!isCalendarOpen())"
  (click)="toggleCalendar($event)"
>
  <gui-range-date
    #dateControlRef
    [uid]="widget.uid"
    [hint]="templateData.hint"
    [showErrors]="false"
    [errors]="templateData.errors"
    [touched]="templateData.touched"
    [required]="templateData.validator?.required"
    [disabled]="templateData.disabled"
    [readonly]="templateData.readonly"
    [value]="templateData.value"
    [icon]="templateData.icon"
    [localeId]="templateData.lang"
    [separator]="templateData.separator"
    [removePillAriaLabel]="templateData.removePillAriaLabel"
    [startDateAriaLabel]="templateData.startDateAriaLabel"
    [endDateAriaLabel]="templateData.endDateAriaLabel"
    (change)="onChangeDate($event)"
    (inputError)="onInputError($event)"
    (focus)="openCalendar()"
    (blur)="adapter.onBlur()"
    (pillClick)="onPillClick($event)"
  ></gui-range-date>

  @if (isCalendarOpen()) {
    <gui-range-calendar
      #calendarControlRef
      [uid]="widget.uid"
      [hint]="templateData.hint"
      [touched]="templateData.touched"
      [required]="templateData.validator?.required"
      [disabled]="templateData.disabled"
      [readonly]="templateData.readonly"
      [value]="templateData.value"
      [focusDate]="focusDate()"
      [prevMonthIcon]="templateData.prevMonthIcon"
      [nextMonthIcon]="templateData.nextMonthIcon"
      [nextMonthAriaLabel]="templateData.nextMonthAriaLabel"
      [prevMonthAriaLabel]="templateData.prevMonthAriaLabel"
      [dayFormat]="templateData.dayFormat"
      [weekdayFormat]="templateData.weekdayFormat"
      [monthFormat]="templateData.monthFormat"
      [minDate]="templateData.minDate"
      [maxDate]="templateData.maxDate"
      [disabledRanges]="templateData.disabledRanges"
      [numberOfMonths]="templateData.numberOfMonths"
      [localeId]="templateData.lang"
      (change)="onChangeDate($event)"
      (blur)="onBlurCalendar()"
    ></gui-range-calendar>
  }
</div>

@if (showErrors) {
  <ul
    gui-errors
    [uid]="widget.uid"
    [templateData]="templateData"
    [attr.data-cy]="widget.uid + '_validator-errors'"
  ></ul>
}
