@let templateData = adapter.templateData();

@if (props.template && templateData.value) {
  @for (_ of templateData.value; track $index) {
    <div class="card">
      <ng-container
        ffRepeaterField
        [repeaterIndex]="$index"
        [field]="props.template"
      />
      <button type="button" (click)="removeItem($index)">{{ props.removeLabel ?? 'Remove' }}</button>
    </div>
  }
}
<button type="button" (click)="addItem()" [disabled]="props.limit ? props.limit === (templateData.value?.length ?? 0) : false">
  {{ props.addLabel ?? 'Add' }}
</button>
