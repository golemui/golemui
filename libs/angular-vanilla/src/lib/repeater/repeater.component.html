@let templateData = adapter.templateData();
@let repeaterTemplate = field.props?.['template'];

@if (repeaterTemplate && templateData.value) {
  @for (_ of templateData.value; track $index) {
    <div class="card">
      <ng-container
        ffRepeaterField
        [repeaterIndex]="$index"
        [field]="repeaterTemplate"
      />
      <button type="button" (click)="removeItem($index)">Remove Item</button>
    </div>
  }
}
<button type="button" (click)="addItem()">Add Item</button>
