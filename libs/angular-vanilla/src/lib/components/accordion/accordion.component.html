@let templateData = adapter.templateData();

<div class="gui-field" [id]="widget.uid">
  @for (section of templateData.sections; track section.uid) {
    <div class="gui-accordion__section">
      <button
        type="button"
        [id]="'accordion_button_' + section.uid"
        [attr.aria-controls]="'accordion_section_' + section.uid"
        [attr.aria-expanded]="activeSections[section.uid] ? 'true' : 'false'"
        [class.active]="activeSections[section.uid]"
        (click)="onClickButton(section.uid)"
      >
        {{ section.label }}<span class="gui-accordion__icon"></span>
      </button>

      @if (activeSections[section.uid] || templateData.renderMode !== 'activeOnly') {
        <section
          class="gui-field"
          role="region"
          [hidden]="!activeSections[section.uid] && templateData.renderMode !== 'activeOnly'"
          [id]="'accordion_section_' + section.uid"
          [attr.aria-labelledby]="'accordion_button_' + section.uid"
        >
          <ng-container guiField [field]="getChild(section.uid)" />
        </section>
      }
    </div>
  }
</div>
