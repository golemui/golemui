@let templateData = adapter().templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

<gui-calendar-picker-control
  [attr.prevMonthIcon]="templateData.prevMonthIcon"
  [attr.nextMonthIcon]="templateData.nextMonthIcon"
  [attr.dayFormat]="templateData.dayFormat"
  [attr.weekdayFormat]="templateData.weekdayFormat"
  [attr.monthFormat]="templateData.monthFormat"
  (change)="onChangeDate($event)"
></gui-calendar-picker-control>

@if (showErrors && field) {
  <ul
    gui-errors
    [uid]="field.uid"
    [templateData]="templateData"
    [attr.data-cy]="field.uid + '_validator-errors'"
  ></ul>
}
