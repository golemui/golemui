@let templateData = adapter.templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

<label gui-label [for]="field.uid" [uid]="field.uid" [templateData]="templateData"></label>

<div class="gui-field">
  <gui-date-control
    [uid]="field.uid"
    [hint]="templateData.hint"
    [touched]="templateData.touched"
    [errors]="templateData.errors"
    [hasError]="showErrors"
    [disabled]="templateData.disabled"
    [readonly]="templateData.readonly"
    [value]="templateData.value"
    [icon]="templateData.icon"
    (change)="onChangeDate($event)"
    (inputError)="onInputError($event)"
    (blur)="adapter.onBlur()"
  ></gui-date-control>
</div>

@if (showErrors) {
  <ul
    gui-errors
    [uid]="field.uid"
    [templateData]="templateData"
    [attr.data-cy]="field.uid + '_validator-errors'"
  ></ul>
}
