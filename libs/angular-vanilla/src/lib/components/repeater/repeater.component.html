@let templateData = adapter.templateData();

<div [id]="widget.uid">
  @if (templateData.label) {
    <h2>{{ templateData.label }}</h2>
  }
  @if (templateData.template && templateData.value) {
    @for (_ of templateData.value; track $index) {
      <div class="card">
        <ng-container guiRepeaterField [repeaterIndex]="$index" [field]="templateData.template" />
        <button type="button" class="gui-button" (click)="removeItem($index)">
          {{ templateData.removeLabel ?? 'Remove' }}
        </button>
      </div>
    }
  }
  <button
    type="button"
    class="gui-button"
    (click)="addItem()"
    [disabled]="
      templateData.limit ? templateData.limit === (templateData.value?.length ?? 0) : false
    "
  >
    {{ templateData.addLabel ?? 'Add' }}
  </button>
</div>
