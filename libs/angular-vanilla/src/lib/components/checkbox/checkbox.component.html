@let templateData = adapter.templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

<label gui-label [for]="field.uid" [uid]="field.uid" [templateData]="templateData">
  @if (showErrors) {
    <ul gui-errors [uid]="field.uid" [templateData]="templateData"></ul>
  }
</label>

<div class="gui-field gui-field--horizontal">
  <input
    type="checkbox"
    guiAria
    [uid]="field.uid"
    [templateData]="templateData"
    [id]="field.uid"
    [value]="templateData.value ?? false"
    [checked]="templateData.value ? true : undefined"
    [disabled]="templateData.disabled"
    [readonly]="templateData.readonly"
    [attr.aria-readonly]="templateData.readonly"
    [attr.aria-required]="templateData.validator?.required"
    (click)="!templateData.readonly && valueChanged($event)"
    (blur)="adapter.onBlur()"
  />
</div>
