@let templateData = adapter.templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

<label gui-label [for]="field.uid" [uid]="field.uid" [templateData]="templateData"></label>

<div class="gui-field">
  @if (optionsLoading === true) {
    <span>Loading...</span>
  } @else {
    @for (opt of templateData.options; track opt.value; let i = $index) {
      <label [for]="field.uid + '_' + i">
        <input
          type="radio"
          guiAria
          [uid]="field.uid"
          [attr.data-cy]="field.uid + '_radiogroup_' + i"
          [templateData]="templateData"
          [id]="field.uid + '_' + i"
          [name]="field.uid"
          [required]="templateData.validator?.required"
          [value]="opt.value"
          [checked]="hasMatchingValue && opt.value === templateData.value"
          [disabled]="templateData.disabled || templateData.readonly"
          (change)="valueChanged($event)"
          (blur)="adapter.onBlur()"
        />
        {{ opt.label }}
      </label>
    }
  }
</div>

@if (showErrors) {
  <ul gui-errors [uid]="field.uid" [templateData]="templateData"></ul>
}
