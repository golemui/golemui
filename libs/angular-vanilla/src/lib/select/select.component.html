@let templateData = adapter.templateData();
@let showErrors = templateData.touched && templateData.errors && templateData.errors.length > 0;

<label [for]="field.uid">
  {{ templateData.label + (templateData.validator?.required ? ' *' : '') }}
  @if (templateData.hint) {
    <div class="gui-field-hint" [id]="field.uid + '_hint'">{{ templateData.hint }}</div>
  }
</label>
<div class="gui-field">
  <select
    [id]="field.uid"
    [class]="{
      'gui-select--icon': templateData.icon,
      'gui-select--icon-right': templateData.iconPosition === 'right',
    }"
    [value]="templateData.value ?? ''"
    [disabled]="templateData.disabled || templateData.readonly"
    [attr.aria-invalid]="templateData.touched && templateData.errors?.length"
    [attr.aria-readonly]="templateData.disabled || templateData.readonly"
    [attr.aria-errormessage]="field.uid + '_errors'"
    [attr.required]="templateData.validator?.required"
    [attr.aria-describedby]="templateData.hint ? field.uid + '_hint' : null"
    (change)="valueChanged($event)"
    (blur)="adapter.onBlur()"
  >
    @if (optionsLoading === true) {
      <option [value]="">Loading...</option>
    } @else {
      <option value="" [attr.selected]="!hasMatchingValue ? '' : null" disabled>
        {{ templateData.placeholder ?? 'Select an option' }}
      </option>

      @for (opt of templateData.options; track opt.value) {
        <option
          [value]="opt.value"
          [attr.selected]="(hasMatchingValue && opt.value === templateData.value) ? '' : null"
        >
          {{ opt.label }}
        </option>
      }
    }
  </select>

  @if (templateData.icon) {
    <span
      class="gui-field-icon"
      [class.gui-field-icon--right]="templateData.iconPosition === 'right'"
      [ngClass]="templateData.icon"
    ></span>
  }
</div>

@if (showErrors) {
  <ul class="gui-validator" [id]="field.uid + '_errors'">
    @for (error of templateData.errors; track $index) {
      <li class="gui-validator__error" role="status">{{ error }}</li>
    }
  </ul>
}
