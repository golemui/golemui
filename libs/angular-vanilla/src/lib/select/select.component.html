@let templateData = adapter.templateData();

<label [for]="field.uid">
  {{ templateData.label + (templateData.validator?.required ? ' *' : '') }}
  @if (templateData.hint) {
    <div class="gui-field-hint" [attr.id]="field.uid + '_hint'">{{ templateData.hint }}</div>
  }
</label>
<div class="gui-field">
  <select
    [id]="field.uid"
    [class]="{
      'gui-select--icon': templateData.icon,
      'gui-select--icon-right': templateData.iconPosition === 'right',
    }"
    [value]="templateData.value ?? ''"
    [disabled]="templateData.disabled"
    (change)="valueChanged($event)"
    (blur)="adapter.onBlur()"
  >
    @if (optionsLoading === true) {
      <option [value]="">Loading...</option>
    } @else {
      <option value="" selected disabled>
        {{ templateData.placeholder ?? 'Select an option' }}
      </option>

      @for (opt of templateData.options; track opt.value) {
        <option
          [value]="opt.value"
          [selected]="hasMatchingValue && opt.value === templateData.value"
        >
          {{ opt.label }}
        </option>
      }
    }
  </select>

  @if (templateData.icon) {
    <span
      class="gui-field-icon"
      [class.gui-field-icon--right]="templateData.iconPosition === 'right'"
      [ngClass]="templateData.icon"
    ></span>
  }
</div>
