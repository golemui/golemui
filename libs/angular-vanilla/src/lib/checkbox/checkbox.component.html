@let templateData = adapter.templateData();

<label [for]="field.uid">{{ templateData.label + (templateData.required ? ' *' : '') }}</label>

<div class="ff-field ff-field--horizontal" [id]="field.uid">
  <input
    type="checkbox"
    [id]="field.uid"
    [value]="templateData.value ?? false"
    [disabled]="templateData.disabled"
    [attr.aria-readonly]="templateData.readonly"
    [attr.aria-required]="templateData.required"
    [attr.aria-checked]="templateData.value ?? false"
    (click)="!templateData.readonly && valueChanged($event)"
  />
</div>
