@let templateData = adapter.templateData();

<div class="field horizontal">
  @if (templateData.label) {
    <label [for]="field.uid">{{ templateData.label + (templateData.required ? ' *' : '') }}</label>
  }
  <input
    type="checkbox"
    [id]="field.uid"
    [value]="templateData.value ?? false"
    [disabled]="templateData.disabled"
    [ariaReadOnly]="templateData.readonly"
    (click)="templateData.readonly && $event.preventDefault()"
    (input)="valueChanged($event)"
  />
</div>
