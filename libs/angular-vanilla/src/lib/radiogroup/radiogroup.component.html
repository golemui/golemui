@let templateData = adapter.templateData();

<label [for]="field.uid" class="gui-field__label">
  {{ templateData.label + (templateData.validator?.required ? ' *' : '') }}
  @if (templateData.hint) {
    <div class="gui-field-hint" [attr.id]="field.uid + '_hint'">{{ templateData.hint }}</div>
  }
</label>
<div class="gui-field">
  @if (optionsLoading === true) {
    <span>Loading...</span>
  } @else {
    @for (opt of templateData.options; track opt.value; let i = $index) {
      <label [for]="field.uid + '_' + i">
        <input
          type="radio"
          [id]="field.uid + '_' + i"
          [name]="field.uid"
          [value]="opt.value"
          [checked]="hasMatchingValue && opt.value === templateData.value"
          [disabled]="templateData.disabled || templateData.readonly"
          [attr.aria-readonly]="templateData.disabled || templateData.readonly"
          (change)="valueChanged($event)"
          (blur)="adapter.onBlur()"
        />
        {{ opt.label }}
      </label>
    }
  }
</div>
