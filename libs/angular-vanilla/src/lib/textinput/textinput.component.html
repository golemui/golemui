@let templateData = adapter.templateData();

<label [for]="field.uid">
  {{ templateData.label + (templateData.required ? ' *' : '') }}
  @if (templateData.hint) {
    <div class="gui-textinput__hint" [attr.id]="field.uid + '_hint'">{{ templateData.hint }}</div>
  }
</label>
<div class="gui-field">
  <input
    type="text"
    [id]="field.uid"
    [class]="{
      'gui-textinput--icon': templateData.icon,
      'gui-textinput--icon-right': templateData.iconPosition === 'right',
    }"
    [value]="templateData.value ?? ''"
    [disabled]="templateData.disabled"
    [readOnly]="templateData.readonly"
    [attr.placeholder]="templateData.placeholder"
    (input)="valueChanged($event)"
    [attr.aria-required]="templateData.required"
    [attr.aria-describedby]="templateData.hint ? field.uid + '_hint' : undefined"
  />

  @if (templateData.icon) {
    <span
      class="gui-textinput__icon"
      [class]="{ 'gui-textinput__icon-right': templateData.iconPosition === 'right' }"
    ></span>
  }
</div>
