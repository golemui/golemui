@let templateData = adapter.templateData();

<nav class="ff-field ff-field--horizontal" role="tablist" [id]="field.uid">
  @for (tab of templateData.tabs; track tab.uid) {
    <a
      role="tab"
      [tabindex]="$index"
      [class.active]="tab.uid === activeTab"
      (click)="onClickTab(tab.uid)"
      (keydown)="onClickTab(tab.uid)"
    >
      {{ tab.label }}
    </a>
  }
</nav>

@for (child of templateData.children; track child.uid) {
  @if (child.uid === activeTab) {
    <section role="tabpanel">
      <ng-container ffField [field]="child" />
    </section>
  }
}
