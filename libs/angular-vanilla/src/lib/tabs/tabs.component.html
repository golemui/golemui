@let templateData = adapter.templateData();

<nav class="gui-field gui-field--horizontal" role="tablist" [id]="field.uid">
  @for (tab of templateData.tabs; track tab.uid; let i = $index) {
    <button
      #tabButtonRef
      type="button"
      role="tab"
      [tabindex]="tab.uid === activeTab ? null : -1"
      [id]="'tab_' + i"
      [attr.aria-controls]="'tabpanel_' + i"
      [attr.aria-selected]="tab.uid === activeTab ? 'true' : 'false'"
      [class.active]="tab.uid === activeTab"
      (click)="onClickTab(tab.uid)"
      (keydown)="onKeyDown($event)"
    >
      {{ tab.label }}
    </button>
  }
</nav>

@for (child of templateData.children; track child.uid; let i = $index) {
  @if (child.uid === activeTab) {
    <section
      role="tabpanel"
      tabindex="0"
      [id]="'tabpanel_' + i"
      [attr.aria-labelledby]="'tab_' + i"
    >
      <ng-container guiField [field]="child" />
    </section>
  }
}
