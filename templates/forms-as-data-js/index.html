<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GolemUI · Forms as Data</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  </head>
  <body>
    <main>
      <h1>Forms as data</h1>
      <p class="lede">
        The form below was derived from <code>schema</code> — not one line of
        form markup. Edit the schema in <code>src/main.js</code> (add a field,
        change a type) and watch the form follow. Try a bad email, then Save.
      </p>
      <gui-form id="app-form"></gui-form>
      <pre id="received" class="received" hidden></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
