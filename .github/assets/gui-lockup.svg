<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-label="GolemUI {gui.} + GolemUI lockup">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Mark: baseline y=170, FS 160 -->
  <text x="200" y="170"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="600"
        font-size="160"
        text-anchor="middle"
        letter-spacing="-2">
    <tspan fill="url(#brand)">{</tspan><tspan fill="#ffffff">gui.</tspan><tspan fill="url(#brand)">}</tspan>
  </text>

  <!-- Wordmark: baseline y=170, FS 200 — cap-height 146 matches mark brace visual height -->
  <text x="890" y="170"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="700"
        font-size="200"
        text-anchor="middle"
        letter-spacing="-4">
    <tspan fill="#ffffff">Golem</tspan><tspan fill="url(#brand)">UI</tspan>
  </text>
</svg>
