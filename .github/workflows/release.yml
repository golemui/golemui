name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        type: choice
        required: true
        default: stable
        options:
          - stable
          - rc
      dry-run:
        description: Dry run (skip publish and tag push)
        type: boolean
        required: true
        default: false

jobs:
  release:
    name: Nx Release (${{ inputs.release-type }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure git remote with PAT
        run: |
          git remote set-url origin https://${{ github.actor }}:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git

      - name: config git user
        run: |
          git config --global user.name "Roger"
          git config --global user.email "roger@golemui.com"

      - name: Release to Github and NPM
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096 --trace-warnings"
          npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          RELEASE_TYPE: ${{ inputs.release-type }}
          DRY_RUN: ${{ inputs.dry-run }}
