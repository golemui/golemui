name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npx nx run-many --target=build --all --parallel

      - name: Build shared styles
        run: npm run build:styles

      - name: Publish existing versions to npm
        run: npx nx release publish --skip-git
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
