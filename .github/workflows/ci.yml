name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm ci

      - name: Check generated schemas are up to date
        run: |
          # Fail fast on a crashing generator instead of relying on the runner's
          # undeclared `bash -e` default, which a shell: change would drop.
          set -euo pipefail
          npm run generate:schemas
          # Intent-to-add so brand-new generated files also show up in the diff
          # (git diff ignores untracked files).
          git add -AN -- libs/schemas libs/gui/schemas
          git diff --exit-code -- libs/schemas libs/gui/schemas

      - name: Build affected
        run: npx nx affected --target=build

      - name: Test affected
        run: npx nx affected --target=vite:test

      - run: npm run lint:affected
