name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --legacy-peer-deps

      - run: cd docs && npm i

      - run: cd docs/template && npm i
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npx nx run-many -t lint test build --no-cloud

      # Remove this line since it's Nx Cloud specific
      # - run: npx nx fix-ci
      #   if: always()
