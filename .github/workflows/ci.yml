name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build template
        run: cd docs/template && npm i && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build documentation
        run: cd docs && npm i && npm run build

      - run: npx nx run-many -t lint test build --no-cloud

#      - name: Cypress component testing
#        run: npx nx affected --target=component-test

      # Remove this line since it's Nx Cloud specific
      # - run: npx nx fix-ci
      #   if: always()
