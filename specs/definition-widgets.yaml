# definition.md, the widget keys and the submit button (old non-negotiable rules 2 and 7). The
# validator rejects an option at the wrong level, and only warns about a `submit` type.
file: definition.md
section:
  [
    Widgets,
    States and conditions,
    'rule: widget-options-under-props',
    'rule: submit-is-a-button-with-action-type',
  ]
tests:
  - id: hint-and-condition
    unit: widget-options-under-props
    scenario:
      - The phone field should show the hint "We only call about your order", and appear only when the customer ticks "Call me".
      - A VAT number input needs a short helper text under it, and must be hidden unless the buyer is a company.
    question: Where should the agent put the helper text and the condition?
    options:
      split: The condition (`include`) at the top level of the widget, next to `label`; the helper text (`hint`) under `props`
      top: Both at the top level of the widget, next to `label`
      props: Both under `props`
    expect: split

  - id: send-button
    unit: submit-is-a-button-with-action-type
    scenario:
      - The quote form needs a "Request a quote" button that sends it.
      - At the end of the survey there should be a "Send answers" button.
    question: Which widget should the agent write for it?
    options:
      button: '`{ "kind": "action", "type": "button", "label": "…", "actionType": "submit" }`'
      submit-type: '`{ "kind": "action", "type": "submit", "label": "…" }`'
      click: '`{ "kind": "action", "type": "button", "label": "…", "on": { "click": "submit" } }`'
    expect: button
