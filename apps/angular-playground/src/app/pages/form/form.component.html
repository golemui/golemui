<div>
  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <gui-form
    [formDef]="formDef"
    [data]="formData"
    [fieldLoaders]="customFieldLoaders"
    [middlewares]="middlewares"
    [validators]="validators"
    [itemRenderers]="itemRenderers"
    [validateOn]="'eager'"
    (formHealth)="onFormHealth($event)"
    (formEvent)="onFormEvent($event)"
  ></gui-form>
</div>
