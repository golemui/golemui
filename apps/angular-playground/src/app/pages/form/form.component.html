<div>
  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <gui-form
    [formDef]="formDef"
    [data]="formData"
    [fieldLoaders]="vanillaFieldLoaders"
    [middlewares]="middlewares"
    [customValidators]="customValidators"
    [validateOn]="'blur'"
    (formError)="onFormError($event)"
    (event)="onFormEvent($event)"
  ></gui-form>
</div>
