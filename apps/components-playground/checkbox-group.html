<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkbox group · GolemUI Components playground</title>
    <link rel="stylesheet" href="/src/styles.scss" />
  </head>
  <body data-pg-events="gui-input gui-change gui-blur">
    <main class="pg-main">
      <section class="pg-section">
        <h1>gui-checkbox-group</h1>
        <p>
          Native checkboxes in a group named by the label. The value lists the checked options in
          the options' order, whatever order you check them in. A required group says so in its name
          and needs at least one checked.
        </p>
      </section>

      <section class="pg-section">
        <h2>Groups</h2>
        <div class="pg-stack">
          <gui-checkbox-group id="toppings" label="Toppings" hint="Pick any"></gui-checkbox-group>
          <gui-checkbox-group id="days" label="Delivery days" direction="row"></gui-checkbox-group>
          <gui-checkbox-group id="readonly" label="Read-only" readonly></gui-checkbox-group>
          <gui-checkbox-group id="disabled" label="Disabled" disabled></gui-checkbox-group>
          <gui-checkbox-group id="errors" label="With an error" touched></gui-checkbox-group>
        </div>
      </section>

      <section class="pg-section">
        <h2>In a form</h2>
        <form id="group-form" class="pg-stack">
          <gui-checkbox-group
            id="form-group"
            name="toppings"
            label="Toppings"
            required
          ></gui-checkbox-group>
          <div class="pg-row">
            <button type="submit" class="pg-button">Submit</button>
            <button type="reset" class="pg-button">Reset</button>
          </div>
          <output id="group-form-output"></output>
        </form>
      </section>
    </main>
    <script type="module" src="/src/pages/checkbox-group.ts"></script>
  </body>
</html>
