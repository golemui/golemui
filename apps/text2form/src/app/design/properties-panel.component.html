<div class="properties-panel">
  <div class="properties-header">
    <span class="properties-type">{{ widget()['type'] }}</span>
    <span class="properties-uid">#{{ widget()['uid'] }}</span>
  </div>
  <div class="properties-form">
    <gui-form
      [formDef]="propertiesFormDef()"
      [data]="propertiesData()"
      [widgetLoaders]="{}"
      [validators]="{}"
      [validateOn]="'eager'"
      (formEvent)="onFormEvent($event)"
    />
  </div>
</div>
