<div class="app-layout">
  <!-- Left Column: Chat -->
  <aside class="chat-sidebar">
    <div class="chat-header">
      <h2>Text2Form</h2>
      <p>Powered by GolemUI</p>
    </div>

    <div class="chat-history">
      <div *ngFor="let msg of messages" [ngClass]="['chat-message', msg.role]">
        <div class="message-bubble">{{ msg.content }}</div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <div class="textarea-container">
          <textarea
            [ngModel]="chatInput"
            (ngModelChange)="onChatInputChange($event)"
            placeholder="Ask me to create a form..."
            (keydown.enter)="$event.preventDefault(); sendMessage()"
          >
          </textarea>
          @if (tokenCount > 0) {
          <span class="token-count">~{{ tokenCount }}</span>
          }
        </div>
        <button (click)="sendMessage()" [disabled]="!chatInput.trim() || thinking">
          @if (thinking) {
          <span class="spinner spinner-sm"></span>
          } @else {
          <span class="icon-send">➤</span>
          }
        </button>
      </div>
    </div>
  </aside>

  <!-- Right Column: Form/JSON Viewer -->
  <main class="content-main">
    <header class="tabs-header">
      <button [class.active]="activeTab === 'form'" (click)="switchTab('form')">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } Preview
      </button>
      <button [class.active]="activeTab === 'json'" (click)="switchTab('json')">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } Edit
      </button>
      <button [class.active]="activeTab === 'design'" (click)="switchTab('design')">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } Design
      </button>
    </header>

    <div class="tab-content" [ngSwitch]="activeTab">
      @if (error) {
      <div class="error-container">
        <p class="error">{{ error }}</p>
      </div>
      }
      <!-- Form Tab -->
      <div *ngSwitchCase="'form'" class="form-preview-container">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } @else {
        <div class="form-wrapper">
          <gui-form
            [formDef]="formJson()"
            [data]="{}"
            [widgetLoaders]="{}"
            [validators]="{}"
            [validateOn]="'eager'"
            (formHealth)="onFormHealth($event)"
            (formEvent)="onFormEvent($event)"
          ></gui-form>
        </div>
        }
      </div>

      <!-- JSON Tab -->
      <div *ngSwitchCase="'json'" class="json-editor-container">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } @else {
        <textarea
          class="json-editor"
          [ngModel]="formJson()"
          (ngModelChange)="onJsonChange($event)"
        ></textarea>
        }
      </div>

      <!-- Design Tab -->
      <div *ngSwitchCase="'design'" class="design-tab-container">
        @if (thinking) {
        <span class="spinner spinner-tab"></span>
        } @else {
        <app-design [formDef]="formJson()"></app-design>
        }
      </div>
    </div>
  </main>
</div>
