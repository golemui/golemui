<ff-textinput>
  <label for="fieldUid">
    Label
    <div class="ff-textinput__hint" id="fieldUid_hint">Hint</div>
  </label>

  <div class="ff-field">
    <input
      type="text"
      id="fieldUid"
      class="ff-textinput__icon ff-textinput__icon--right"
      disabled
      readonly
      placeholder="Custom placeholder"
      aria-required="true"
      aria-describedby="fieldUid_hint"
    />
    <span class="ff-textinput__icon ff-textinput__icon--right"></span>
  </div>
</ff-textinput>
